user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    # Custom error page
    error_page 403 /403.html;

    # ──────────────────────────────
    # Whitelisted IP ranges (http-level)
    # ──────────────────────────────
    geo $allowed_client {
        default                    0;
        182.79.32.192/27           1;   # Powai
        59.144.72.0/27             1;   # Powai
        122.187.179.248/29         1;   # Hazira
        182.66.85.24/29            1;   # Hazira
        182.71.157.32/29           1;   # Talegaon
        122.187.64.72/29           1;   # Coimbatore
        182.66.221.224/27          1;   # Chennai
        131.229.128.0/17           1;   # Web proxy
        161.69.32.0/19             1;
        161.69.0.0/20              1;
        161.69.16.0/21             1;
        161.69.64.0/18             1;
        52.52.221.153/32           1;
        15.236.59.65/32            1;
        103.224.35.159             1;
        40.77.189.95               1;
        103.75.173.8               1;
        48.217.234.50/32           1;   # Temporary - Your current IP
    }

    # ──────────────────────────────
    # Redirect HTTP → HTTPS
    # ──────────────────────────────
    server {
        listen 80;
        server_name goalassist.ltdic.com;
        return 301 https://$host$request_uri;
    }

    # ──────────────────────────────
    # HTTPS server with IP whitelisting
    # ──────────────────────────────
    server {
        listen 443 ssl;
        server_name goalassist.ltdic.com;

        ssl_certificate     /etc/nginx/ssl/star_ltdic_com.crt;
        ssl_certificate_key /etc/nginx/ssl/star_ltdic_com.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline';" always;

        # Custom error page location
        location = /403.html {
            root /usr/share/nginx/html;
            internal;
        }

        # === Frontend ===
        location / {
            if ($allowed_client = 0) {
                return 403;
            }

            proxy_pass         http://localhost:3000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # === Backend API ===
        location /api/ {
            # UA / Accept filters
            if ($http_user_agent ~* "Postman|ThunderClient") {
                return 403;
            }
            if ($http_accept ~* "text/html") {
                return 403;
            }

            if ($allowed_client = 0) {
                return 403;
            }

            proxy_pass         http://localhost:8000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
